name: build-wasm

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:contract
      - run: npm run build:token
      - run: ls -la build/*.wasm && sha256sum build/*.wasm
      - run: npm install --no-save near-workspaces
      - name: sandbox test
        shell: bash
        run: |
          set +e
          npm run test:sandbox > sandbox.log 2>&1
          code=$?
          cat sandbox.log
          if [ $code -ne 0 ]; then
            msg=$(tail -c 3000 sandbox.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=sandbox::$msg"
          fi
          s=$(grep -E "^# (tests|pass|fail|skipped)" sandbox.log | tr "\n" " ")
          echo "::notice title=sandbox-summary::$s"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm
          path: |
            build/registry.wasm
            build/ledger-token.wasm
            sandbox.log
